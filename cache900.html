function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Memasang Offline Cache: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Cache Berhasil Terpasang ✔";setTimeout(function(){window.msgs.innerHTML="Sekarang Tutup Browser dan Buka Browser Lagi...";},1500);}

      /* ===== BACKGROUND ===== */

        background-size:
          100% 100%,
          100% 100%,
          100% 100%,
          60px 60px,
          60px 60px,
          20px 20px;
        background-attachment: fixed;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(255, 40, 60, 0.025) 0px,
          rgba(255, 40, 60, 0.025) 1px,
          transparent 1px,
          transparent 3px
        );
        pointer-events: none;
        z-index: 1;
      }

      body::after {
        content: "";
        position: fixed;
        inset: -10%;
        background:
          radial-gradient(circle at 30% 40%, rgba(255, 40, 60, 0.15), transparent 30%),
          radial-gradient(circle at 70% 60%, rgba(255, 0, 80, 0.12), transparent 30%);
        pointer-events: none;
        z-index: 0;

      @keyframes bgMove {
